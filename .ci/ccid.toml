schema = 1
project = "czkp"

[checks.verify]
cache = false
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["wasm-pack", "--version"], ["node", "--version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_env = ["CZKP_FIXTURE_HEAD", "CZKP_FIXTURE_LOCK_SHA", "BB_LIB_DIR", "BB_NATIVE_RUSTFLAGS"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories", "licenses"]]

# Maintenance job: resolves and retains an npm lock without claiming validation.
[checks.resolve-npm]
kind = "commands"
commands = [["bash", ".ci/resolve-npm.sh"]]
cache = false
cache_outputs = ["package-lock.json"]

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "linux"
checks = ["resolve-dependencies"]
workflow = "resolve-dependencies"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[jobs.resolve-npm]
scheduler = "forgejo"
runs_on = "linux"
checks = ["resolve-npm"]
workflow = "resolve-npm"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

[check_shell]
