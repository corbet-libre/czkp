[package]
name = "czkp"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Shared zero-knowledge core: encoding, hashes, prove and verify, separately selectable"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/czkp"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
process = ["dep:serde_json"]
schema = ["dep:utoipa", "dep:schemars"]

[dependencies]
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
data-encoding = "2.9"
ed25519-dalek = "3.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

# Public test data/code source only; never a production Rust dependency.
[package.metadata.proof-fixture]
git = "https://github.com/corbet-libs/cblc"
branch = "main"
