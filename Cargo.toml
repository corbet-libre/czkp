[package]
name = "czkp"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Shared zero-knowledge core: encoding, hashes, prove and verify, separately selectable"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/czkp.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
schema = ["dep:utoipa", "dep:schemars"]
native = ["dep:serde_json"]
native-worker = ["native", "dep:barretenberg-rs", "dep:rlimit"]
# Test fixtures only: the settings catalogue's reference community. Production code
# never enables this; parameters come from a verified rulebook alone.
reference = []

[dependencies]
ark-bn254 = "0.6"
ark-ff = "0.6"
pso-poseidon = "0.5"
rs_merkle = "1.5"
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
data-encoding = "2.9"
ed25519-dalek = "3.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
serde_json = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
barretenberg-rs = { version = "5", default-features = false, features = ["ffi"], optional = true }
rlimit = { version = "0.11", optional = true }

[[bin]]
name = "czkp-bb-worker"
path = "src/bin/bb_worker.rs"
required-features = ["native-worker"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
serde_json = "1"
czkp = { path = ".", features = ["reference"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
