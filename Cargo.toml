[package]
name = "czkp"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Shared zero-knowledge core: encoding, hashes, prove and verify, separately selectable"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/czkp"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
schema = ["dep:utoipa"]

[dependencies]
utoipa = { version = "6", optional = true }
data-encoding = "2.9"
ed25519-dalek = "3.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
serde_json = "1"
